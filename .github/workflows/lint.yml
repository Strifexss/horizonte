name: linter

on:
  push:
    branches:
      - master
      - feature
  pull_request:
    branches:
      - master
      - feature

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Pint
        run: vendor/bin/pint --test

      - name: ESLint
        run: npm run lint:check

      - name: ESLint (typed)
        run: npm run lint:typed

      - name: TypeScript
        run: npm run types

      - name: Quality rules self-check
        run: npm run quality:verify
